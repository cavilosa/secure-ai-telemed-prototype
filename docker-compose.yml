services:
  web:
    # docker compose up will look for a Dockerfile and build a new, custom image from it
    build: . 
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
    ports:
      # the host : the container
      - "5000:5000"
    develop:
      watch:
        - action: sync
          path: .
          target: /code
  db:
    image: postgres
    env_file:
      - .env
    ports:
      - "5001:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:

  # redis:
